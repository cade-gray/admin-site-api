services:
  server:
    image: ghcr.io/cade-gray/admin-site-api:latest
    ports:
      - 3002:4269
    environment:
      - DB_HOST=
      - DB_USER=gorm
      - DB_PASSWORD=
      - DB_NAME=admin_db
      - AUTH_DB_NAME=auth_db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - RAPIDAPI_KEY=
    restart: always
